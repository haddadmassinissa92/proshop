# .github/workflows/backend-ci.yml
#
# Lance automatiquement la suite de tests backend à chaque push et à chaque
# pull request qui touche au dossier backend/. Aucune clé API ni secret
# requis : les tests tournent sur une base MongoDB en mémoire, isolée,
# recréée à chaque exécution — jamais de connexion à une vraie base ni à un
# vrai service externe (Cloudinary, Groq, Resend sont soit non appelés,
# soit simulés dans les tests concernés — voir tests/product.test.js).

name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Lancement de la suite de tests
        run: npm test
